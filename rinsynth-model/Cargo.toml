[package]
name = "rinsynth-model"
version = "0.1.0"
edition = "2021"
description = "Portable parameter/preset model of RustInSynth — shared between the desktop host and the ESP32-S3 firmware port"

[features]
default = []
# std::fs file IO against explicit paths (works on ESP-IDF VFS once mounted).
fs = []
# Desktop conveniences: dirs-based preset directory and name-based load/save.
host-fs = ["fs", "dep:dirs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = { version = "5.0", optional = true }

[dev-dependencies]
tempfile = "3.8"
